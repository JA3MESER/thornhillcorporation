<!DOCTYPE html>
<html lang="en-GB" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thornhill Corporation</title>
  <meta name="theme-color" content="#0a0b0d">
  <link rel="icon" type="image/png" href="/assets/img/icon-dark-96.png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <script>
    (function () { try { var t = localStorage.getItem("thornhill.theme"); if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; document.documentElement.setAttribute("data-theme", t); } catch (e) {} })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/viewer.css">
</head>
<body>
  <!-- ============ Document viewer (shown for /d/<short-link>) ============ -->
  <div class="viewer" id="viewer" hidden>
    <header class="viewer-bar">
      <a href="/" class="brand" aria-label="Thornhill Corporation home">
        <img class="logo-light" src="/assets/img/icon-light-96.png" alt="">
        <img class="logo-dark" src="/assets/img/icon-dark-96.png" alt="">
      </a>
      <div class="viewer-title">
        <h1 id="docTitle">Loading document…</h1>
        <span id="docSub">Thornhill Corporation</span>
      </div>
      <div class="viewer-actions">
        <button class="btn btn-ghost btn-sm" type="button" id="infoBtn" hidden aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          <span class="lbl">Info</span>
        </button>
        <button class="btn btn-ghost btn-sm" type="button" id="shareBtn" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
          <span class="lbl">Copy link</span>
        </button>
        <a class="btn btn-primary btn-sm" id="openBtn" target="_blank" rel="noopener" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></svg>
          <span class="lbl" id="openLbl">Open</span>
        </a>
        <button class="icon-btn theme-toggle" type="button" aria-label="Toggle dark mode">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>
    <div class="viewer-info" id="docInfo" hidden></div>
    <div class="viewer-stage" id="stage">
      <div class="viewer-msg"><div class="spinner"></div><p>Opening document…</p></div>
    </div>
  </div>

  <!-- ============ Ordinary "page not found" ============ -->
  <main class="page-head nf" id="notFound" hidden>
    <div class="container">
      <div class="eyebrow" id="nfEyebrow">Error 404</div>
      <h1 id="nfTitle">This page doesn't exist.</h1>
      <p id="nfText" style="margin: 0 auto 32px;">The page you were looking for may have moved. Let's get you back on track.</p>
      <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; position: relative;">
        <a href="/" class="btn btn-primary">Go to homepage</a>
        <a href="/documents" class="btn btn-ghost" id="nfDocs" hidden>Browse documents</a>
        <a href="/support" class="btn btn-ghost">Contact support</a>
      </div>
    </div>
  </main>

  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/store.js"></script>
  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/viewer.js"></script>
</body>
</html>
